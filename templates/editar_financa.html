{% extends "base.html" %}
{% block content %}
<h2>✏️ Editar Movimento Financeiro</h2>

<div class="card">
    <form action="/financas/editar/{{ financa.id }}" method="POST">
        <label>Tipo de Movimento:</label>
        <select name="tipo" required>
            <option value="receita" {% if financa.tipo == 'receita' %}selected{% endif %}>Receita</option>
            <option value="despesa" {% if financa.tipo == 'despesa' %}selected{% endif %}>Despesa</option>
        </select>

        <label>Descrição:</label>
        <input type="text" name="descricao" value="{{ financa.descricao }}" required>

        <label>Valor (€):</label>
        <input type="number" step="0.01" name="valor" value="{{ "%.2f"|format(financa.valor|float) }}" required>

        <label>Data:</label>
        <input type="text" class="campo-data" name="data" value="{{ financa.data }}" required>

        <br><br>
        <button type="submit" class="btn btn-green">Guardar Alterações</button>
        <a href="/financas" class="btn btn-red">Cancelar</a>
    </form>
</div>
{% endblock %}
